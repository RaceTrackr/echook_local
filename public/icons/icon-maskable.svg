<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid background — no rounded corners, Android clips the shape -->
  <rect width="512" height="512" fill="#0f0f0f"/>

  <!-- Inner content scaled to 80% safe zone, centred in canvas.
       Original gauge: cx=256, cy=300, r=140. Scaling to 0.82x around canvas centre (256,256).
       Transform: translate(256,256) scale(0.82) translate(-256,-256)
       Scaled gauge centre: (256, 256 + (300-256)*0.82) = (256, 292.1)
       Scaled r: 114.8  stroke-width: 22.96
       Recalculated arc points at scale 0.82:
         start 150°: x=256+114.8*cos150=256-99.4=156.6, y=292.1+114.8*sin150=292.1+57.4=349.5
         end   30°:  x=256+114.8*cos30=256+99.4=355.4,  y=292.1+57.4=349.5
         70%  318°:  x=256+114.8*cos318=256+85.3=341.3, y=292.1+114.8*sin318=292.1-77.1=215.0
       Hub radius: 13.1
  -->
  <g transform="translate(256,256) scale(0.82) translate(-256,-256)">

    <!-- Speedometer track arc: 240° from 150° to 30° (via bottom) -->
    <path
      d="M 134.8 370 A 140 140 0 1 1 377.2 370"
      fill="none"
      stroke="#2a2a2a"
      stroke-width="28"
      stroke-linecap="round"
    />

    <!-- Filled arc at ~70% (150° to 318°) -->
    <path
      d="M 134.8 370 A 140 140 0 0 1 360 206"
      fill="none"
      stroke="#cb1557"
      stroke-width="28"
      stroke-linecap="round"
    />

    <!-- Needle from centre (256,300) to 70% arc endpoint (360, 206) -->
    <line
      x1="256" y1="300"
      x2="360" y2="206"
      stroke="white"
      stroke-width="10"
      stroke-linecap="round"
    />

    <!-- Centre hub circle -->
    <circle cx="256" cy="300" r="16" fill="#cb1557"/>

  </g>
</svg>
